# The site is served by Netlify (www.striketrading.la -> striketradinglaos.netlify.app).
# Plain HTML: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

# Old registration links, kept working for links already shared. They go straight to the
# registration system. Netlify keeps ?class=... on the redirect.
# /online-class-regis/ is a real page (online-class-regis/index.html) that also sends visitors there.
[[redirects]]
  from = "/online-regis"
  to = "https://regis.striketrading.la/"
  status = 301

[[redirects]]
  from = "/online-regis/*"
  to = "https://regis.striketrading.la/"
  status = 301
