# Uploads the site to the web host every time main changes.
# Set these in GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
#   FTP_SERVER    e.g. ftp.striketrading.la
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_DIR       folder of the site on the host, ending in / (e.g. public_html/). Optional, default ./
# Until FTP_SERVER is set, the job is skipped and nothing is uploaded.
name: Deploy site by FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Check settings
        if: env.HAS_FTP != 'true'
        run: echo "FTP_SERVER secret is not set yet, so nothing was uploaded."
      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'
      - name: Upload changed files
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.txt
            UPLOAD_THESE_ONLY.txt
